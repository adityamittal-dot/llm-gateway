# Gateway config for scripts/dev_stack.sh (no Docker): mock LLM + local Ollama.
require_auth: true
admin_key: dev-admin
signal_dir: data/signals
keys:
  - {key: sk-dev-local, tenant: dev}
  - {key: sk-tenant-a, tenant: tenant-a}
  - {key: sk-tenant-b, tenant: tenant-b}
providers:
  - {name: mock, type: openai_compat, base_url: "http://127.0.0.1:9000/v1", models: [mock-small, mock-large]}
  - {name: ollama, type: openai_compat, base_url: "http://127.0.0.1:11434/v1", models: ["*"]}
